# ---------------------------------------------------------------------------
# Runtime configuration for the rubric scoring/improvement agent.
#
# Precedence (highest wins):
#     CLI flags  >  environment variables  >  this file  >  dataclass defaults
#
# Env override convention: AGENTIC_<SECTION>__<FIELD>, e.g.
#     AGENTIC_LOOP__MAX_ITERATIONS=8
#     AGENTIC_LLM__PRIMARY=ollama
#
# Nothing under src/agentic_rubric/core/ reads this file or os.environ directly.
# The loop is handed a frozen AppConfig, which is what makes the model, limits
# and backends swappable without touching loop code.
# ---------------------------------------------------------------------------

llm:
  # Name of the provider to try first; must be a key under `providers`.
  primary: gemini
  # Ordered failover chain used when `primary` is unavailable.
  fallbacks: [groq, ollama]

  providers:
    gemini:
      # Google AI Studio, via its OpenAI compatibility layer.
      # https://ai.google.dev/gemini-api/docs/openai
      #
      # Primary because of one number: the free tier allows ~250,000 tokens per
      # minute, against Groq's 8,000 for gpt-oss-120b. A single Reason call in
      # this loop measures 2,100-2,900 tokens and a full iteration ~5,500, so on
      # Groq three calls exhaust the minute and every later call is rate
      # limited. One measured run absorbed eight 429s and then hit the 200,000
      # tokens-per-day ceiling outright. The binding constraint here is requests
      # per minute (10-15) instead, which four calls per iteration fits inside.
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      # Measured live on 2026-08-27, not taken from documentation. Free-tier
      # request limits vary sharply *by model*, and that is the binding
      # constraint for this loop (four calls per iteration):
      #
      #   gemini-3.6-flash        limit: 5 requests/min  -> 429s after one
      #                                                     iteration
      #   gemini-3.5-flash-lite   14 rapid calls, no 429 -> comfortable
      #
      # gemini-2.5-flash is retired ("no longer available to new users").
      # Re-check with `preflight --ping` if a 404 or a quota error appears;
      # Google renames free-tier ids faster than it changes the quotas.
      model: gemini-3.5-flash-lite
      api_key_env: GEMINI_API_KEY
      timeout_s: 90.0
      supports_tools: true
      # The compatibility layer is partial and messages[].name is not part of
      # the documented surface. Nothing here needs it, so it is stripped rather
      # than discovered as a 400 later.
      supports_message_name: false

    groq:
      # GroqCloud speaks the OpenAI chat-completions dialect.
      # https://console.groq.com/docs/openai
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      api_key_env: GROQ_API_KEY
      timeout_s: 90.0
      supports_tools: true
      # Kept as the second link: fast when it has budget, and a genuinely
      # different vendor, so a Google outage does not take the run with it.
      # Groq explicitly does not accept messages[].name. Harmless today (each
      # loop step sends a fresh conversation, so no tool-result turns are
      # replayed) but declared so the client strips it rather than 400-ing the
      # first time someone adds conversation replay.
      supports_message_name: false

    ollama:
      # Local fallback. Needs `ollama serve` and the model pulled.
      base_url: http://localhost:11434/v1
      # Match the tool-capable model installed in the local Ollama instance.
      model: qwen3:latest
      api_key_env: OLLAMA_API_KEY
      timeout_s: 180.0
      supports_tools: true
      requires_key: false

    mock:
      # Deterministic scripted provider. No network, no key, used by the tests
      # and by `--provider mock` for an offline end-to-end demo.
      base_url: ""
      model: mock-1
      api_key_env: ""
      timeout_s: 1.0
      supports_tools: true
      requires_key: false

  # Sampling defaults. Individual call sites may override: the judge runs
  # colder than the reviser, because scoring must be reproducible.
  # Note: Groq converts temperature 0 to 1e-8, so the judge is near
  # deterministic there rather than exactly deterministic. Gemini honours 0.
  temperature: 0.3
  # 4096, not 2048: openai/gpt-oss-120b is a reasoning model and spends output
  # tokens on an internal reasoning field before it emits any content. A cap
  # that looks generous for a 300-word rewrite can return an empty completion.
  max_tokens: 4096

loop:
  max_iterations: 6          # hard cap, enforced by the harness not the model
  target_score: 85.0         # percent of the weighted rubric maximum
  min_improvement: 1.0       # points; smaller deltas count as a plateau
  plateau_patience: 2        # consecutive plateau iterations before stopping
  revise_candidates: 1       # >1 enables the shallow Tree-of-Thoughts branch

memory:
  enabled: true
  backend: sqlite_vec        # sqlite_vec | sqlite_fts | null
  db_path: data/memory.db
  embedder: fastembed        # fastembed | none  (none => BM25 keyword recall only)
  embed_model: BAAI/bge-small-en-v1.5
  recall_top_k: 5
  recall_min_score: 0.25
  # Scope rules. Lessons are the Reflexion payload and outlive the session, so
  # they are recalled across sessions but confined to the rubric that produced
  # them. Episodic records are session-local noise and stay put.
  lesson_scope: rubric       # rubric | global | session
  episodic_scope: session    # session | global
  # Lessons are few and curated, so they are ranked but NOT relevance-gated;
  # the gate applies to episodic recall, which is voluminous. See
  # docs/02_memory_design.md.
  gate_lessons: false
  max_lessons_per_recall: 3
  vector_weight: 0.7         # blend when both vector and keyword channels hit

retry:
  # Transport policy, applied by harness/retry.py around every provider call.
  max_attempts: 4
  base_delay_s: 1.0
  max_delay_s: 30.0
  jitter: full               # full | equal | none
  retry_on_status: [408, 409, 425, 429, 500, 502, 503, 504]
  max_retry_after_s: 60.0    # a longer Retry-After fails over instead of waiting
  # Tool policy. Deliberately tighter: a failing tool is usually deterministic,
  # and two of the five tools spend tokens on every attempt.
  tool_max_attempts: 2
  tool_base_delay_s: 0.25
  repair_attempts: 1         # repair round trips per unparseable response

guardrails:
  token_budget: 200000       # per run, across every LLM call
  token_warn_ratio: 0.8      # note + event at 80% of the budget
  wall_clock_timeout_s: 600
  max_input_chars: 20000     # prompt view of the draft (applied in Perceive)
  max_document_chars: 200000 # hard ingestion cap, applied before the run
  repeat_action_threshold: 3 # identical (action,args) N times in a row => stuck
  stuck_score_epsilon: 0.5
  stuck_score_window: 3      # scorecards inspected by the plateau signal

logging:
  level: INFO
  format: json               # json | console
  trace_dir: runs            # runs/<run_id>/trace.jsonl + summary.json
  trace_enabled: true
  trace_max_field_chars: 2000
  redact_keys: [api_key, authorization]
