[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-forge"
version = "0.1.0"
description = "A hand-rolled Perceive/Reason/Act/Reflect agentic loop that scores text against a rubric and iteratively improves it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
memory = ["sqlite-vec>=0.1.6", "fastembed>=0.4.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
rubric-forge = "agentic_rubric.cli:main"
agentic-rubric = "agentic_rubric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# No `python_version` pin: mypy then checks against the interpreter running it.
# Pinning 3.10 here made mypy parse numpy's 3.12-syntax stubs as 3.10 and abort.
# Real 3.10 compatibility is verified where it actually counts -- the CI matrix
# runs the whole suite on 3.10 -- and `ruff --target-version py310` catches the
# syntax-level regressions statically.
packages = ["agentic_rubric"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Listed one by one rather
# than with a blanket `ignore_missing_imports`, so a new untyped dependency is a
# deliberate entry here instead of a silent hole.
module = ["sqlite_vec.*", "fastembed.*"]
ignore_missing_imports = true
